<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica a6 - Formulario</title>
</head>
<body>
    <h1>Práctica a6 - Formulario de Usuario</h1>

    <form action="usuario" method="post">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <br>
        <div>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" required>
        </div>
        <br>
        <button type="submit">Enviar (POST)</button>
    </form>

    <hr>

    <p><a href="usuario">Probar GET (UsuarioServlet)</a></p>
    <p><a href="hola">Ir a HolaServlet</a></p>
</body>
</html>
