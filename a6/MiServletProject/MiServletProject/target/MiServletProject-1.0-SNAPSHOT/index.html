<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica a6 - Formulario de Usuario y Servlets</title>
    <!-- Tipografía moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Librería JQuery cargada para cumplir el punto 3 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 49, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.8);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0b0f19 70%);
            color: var(--text-main);
            padding: 24px;
            overflow-x: hidden;
        }

        /* Fondo decorativo con luces difusas */
        .ambient-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 0;
            top: 10%;
            right: 15%;
            filter: blur(50px);
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .header-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 9999px;
            margin-bottom: 14px;
        }

        .badge-tag::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: #ffffff;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(15, 23, 42, 0.95);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            margin-top: 10px;
            padding: 15px 24px;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--primary-glow);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.55);
            background: linear-gradient(135deg, #6366f1, #4338ca);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .links-section {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        .links-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .action-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .link-chip {
            padding: 8px 16px;
            font-size: 0.84rem;
            font-weight: 600;
            color: #cbd5e1;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .link-chip:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="main-container">
        <main class="card">
            <header class="header-section">
                <span class="badge-tag">Práctica a6</span>
                <h1>Validación de Usuario</h1>
                <p class="subtitle">Complete los campos para consultar el estado etario mediante el método POST del Servlet.</p>
            </header>

            <!-- Formulario HTML estándar que invoca el método POST de UsuarioServlet -->
            <form action="usuario" method="post" id="formUsuario">
                <div class="form-group">
                    <label for="nombre">Nombre de Usuario</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="nombre" 
                            name="nombre" 
                            placeholder="Ej: Nacho Ayala" 
                            required 
                            autocomplete="name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="edad">Edad</label>
                    <div class="input-wrapper">
                        <input 
                            type="number" 
                            id="edad" 
                            name="edad" 
                            placeholder="Ej: 21" 
                            min="0" 
                            max="130" 
                            required 
                            autocomplete="off"
                        >
                    </div>
                </div>

                <button type="submit" id="btnEnviar" class="btn-submit">
                    <span>Enviar al Servlet (POST)</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <footer class="links-section">
                <span class="links-title">Otras peticiones del proyecto</span>
                <div class="action-links">
                    <a href="usuario" class="link-chip" title="Ejecutar método GET de UsuarioServlet">
                        Probar GET (UsuarioServlet)
                    </a>
                    <a href="hola" class="link-chip" title="Ejecutar HolaServlet">
                        Ir a HolaServlet
                    </a>
                </div>
            </footer>
        </main>
    </div>
</body>
</html>
